[package]
name = "evoclaw-mcp-obsidian"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "BM25 knowledge-base MCP server over an Obsidian markdown vault, for the EvoClaw agent runtime"
license = "MIT"
repository = "https://github.com/DevEloLin/evoclaw-mcp-obsidian"
readme = "README.md"
keywords = ["mcp", "obsidian", "evoclaw", "knowledge-base", "search"]
categories = ["command-line-utilities"]

[[bin]]
name = "evoclaw-mcp-obsidian"
path = "src/main.rs"

[dependencies]
# MCP server SDK (official) — stdio transport + tool macros
rmcp = { version = "0.3", features = ["server", "transport-io", "macros"] }
schemars = "1.0"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }

# vault scan + markdown parsing + structure extraction
walkdir = "2"
globset = "0.4"
regex = "1"
pulldown-cmark = "0.12"

directories = "5"
eyre = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# BM25 full-text index + Chinese (CJK) word segmentation
tantivy = "0.26"
tantivy-jieba = "0.20"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
serial_test = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
